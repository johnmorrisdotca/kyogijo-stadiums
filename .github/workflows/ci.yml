name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
  # The demo's browser tests take an hour on one runner: six jobs run at once, each building the demo and playing one project's tests or a share of WebKit's (a failed test is retried once, and the report says it was).
  demo:
    name: demo (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Playwright's own image, whose tag is the version of @playwright/test in the lockfile (src/ci.test.js holds the two together): the browsers and what they need are in it. Installing the browsers with their system packages took 55 of a shard's 70 minutes, fetching 200 packages from a slow mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        # WebKit is three times as slow as Chromium and was a third of the tests: split by project first, and WebKit's into four (each job about a quarter of an hour).
        include:
          - { project: chromium-phone, shard: 1/1 }
          - { project: chromium-desk, shard: 1/1 }
          - { project: webkit-phone, shard: 1/4 }
          - { project: webkit-phone, shard: 2/4 }
          - { project: webkit-phone, shard: 3/4 }
          - { project: webkit-phone, shard: 4/4 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The demo, played in Chromium and WebKit at a phone's width and a desk's (one project, a share of its tests)
        run: pnpm site && pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports, by ESM and by require
        run: pnpm test:package
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The README's TypeScript and JavaScript examples, type-checked and run against the built package
        run: pnpm test:readme

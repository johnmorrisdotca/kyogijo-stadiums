<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kyogijo Stadiums: a district of real venues</title>
    <meta name="description" content="Several real venues of one city on one plan at their real relative positions and orientations, from OpenStreetMap: BC Place and Rogers Arena side by side in Vancouver, Seattle, and Tokyo Dome with Korakuen Hall, to turn around together in 3D or look down on in 2D." />
    <style>
      :root { color-scheme: light dark; --bg: #f6f4ee; --ink: #10151b; --muted: #434b54; --card: #fff; --line: #b9b3a3; --accent: #1f5fa8; --tab: #10151b; --tab-ink: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d1218; --ink: #f6f3ea; --muted: #bcc3cb; --card: #18212a; --line: #475463; --accent: #7fb2ee; --tab: #f6f3ea; --tab-ink: #0d1218; } }
      :root[data-theme="light"] { color-scheme: light; --bg: #f6f4ee; --ink: #10151b; --muted: #434b54; --card: #fff; --line: #b9b3a3; --accent: #1f5fa8; --tab: #10151b; --tab-ink: #fff; }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #0d1218; --ink: #f6f3ea; --muted: #bcc3cb; --card: #18212a; --line: #475463; --accent: #7fb2ee; --tab: #f6f3ea; --tab-ink: #0d1218; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
      main { max-width: 1280px; margin: 0 auto; padding: 12px 16px 24px; }
      h1 { font-size: 1.4rem; margin: 0 0 2px; }
      p.lede { margin: 0 0 12px; color: var(--muted); }
      .back { margin: 0 0 6px; }
      a { color: var(--accent); }
      [hidden] { display: none !important; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      #tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
      #tabs button { font: inherit; font-size: 1rem; font-weight: 800; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--tab); background: var(--card); color: var(--ink); cursor: pointer; }
      #tabs button[aria-selected="true"] { background: var(--tab); color: var(--tab-ink); }
      /* On a phone seven presets wrap into many rows: closer chips keep the crowd bar and the plan in the first screen. */
      @media (max-width: 520px) {
        #tabs { gap: 6px; }
        #tabs button { font-size: .9rem; min-height: 44px; padding: 0 10px; border-width: 1.5px; }
      }
      #stage { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
      #stage > .ky-district-view > svg.kyogijo { display: block; width: 100%; height: auto; max-height: calc(100vh - 190px); }
      #outside-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 10px; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
      #outside-bar .label { font-weight: 700; margin-right: 4px; }
      #outside-levels { display: flex; flex-wrap: wrap; gap: 6px; }
      #outside-levels button { font: inherit; font-weight: 800; min-height: 44px; min-width: 56px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--tab); background: var(--card); color: var(--ink); cursor: pointer; }
      #outside-levels button[aria-pressed="true"] { background: var(--tab); color: var(--tab-ink); }
      #outside-count { color: var(--muted); font-size: .9rem; }
      .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px; margin: 10px 0 0; }
      label { display: grid; gap: 4px; min-width: 0; font-size: .9rem; color: var(--muted); }
      label.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
      select { width: 100%; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 44px; }
      input[type="checkbox"] { width: 22px; height: 22px; }
      details { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
      summary { cursor: pointer; min-height: 36px; font-weight: 700; display: flex; align-items: center; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 8px 0; }
      dt { color: var(--muted); }
      dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
      .note { color: var(--muted); font-size: .9rem; margin: 8px 0; }
      #error { color: #c0392b; font-weight: 700; }
      fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 10px 0 0; min-width: 0; }
      legend { font-weight: 700; padding: 0 6px; }
      fieldset .picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 4px 12px; }
      table { border-collapse: collapse; width: 100%; font-size: .92rem; }
      th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <p class="back"><a href="./" id="back" data-testid="back"></a></p>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
      <div id="tabs" role="tablist" data-testid="tabs"></div>
      <div id="outside-bar" role="group" aria-labelledby="l-outside" data-testid="outside" hidden>
        <span class="label" id="l-outside"></span>
        <div id="outside-levels"></div>
        <span id="outside-count" role="status" aria-live="polite" data-testid="outside-count"></span>
      </div>
      <p id="error" role="alert" hidden></p>
      <div id="stage" data-testid="stage"></div>
      <p class="note" id="outside-note" data-testid="outside-note" hidden></p>
      <details id="facts" open>
        <summary id="l-facts"></summary>
        <table data-testid="facts"><thead id="head"></thead><tbody id="list"></tbody></table>
        <p class="note" id="between" data-testid="between"></p>
      </details>
      <details id="edit" open>
        <summary id="l-edit"></summary>
        <fieldset id="venues-box"><legend id="l-venues"></legend><div class="picks" id="picks" data-testid="picks"></div></fieldset>
        <div class="controls">
          <label><span id="l-mode"></span><select id="mode"><option value="neighbours"></option><option value="city"></option></select></label>
          <label><span id="l-turn"></span><select id="turn"><option value="0"></option><option value="auto"></option></select></label>
          <label class="check"><input id="labels" type="checkbox" /><span id="l-labels"></span></label>
          <label class="check" id="context-row"><input id="context" type="checkbox" data-testid="context" /><span id="l-context"></span></label>
          <label class="check" id="kodokan-row"><input id="kodokan" type="checkbox" data-testid="kodokan" /><span id="l-kodokan"></span></label>
          <label id="building-row"><span id="l-building"></span><select id="building" data-testid="building"><option value="xray"></option><option value="solid"></option><option value="none"></option></select></label>
          <label><span id="l-view"></span><select id="view"><option value="2d">2D</option><option value="3d">3D</option></select></label>
          <label id="viewpoint-row"><span id="l-viewpoint"></span><select id="viewpoint"><option value="overhead"></option><option value="broadcast"></option><option value="end"></option><option value="corner"></option></select></label>
          <label class="check" id="roof-row"><input id="roof" type="checkbox" checked /><span id="l-roof"></span></label>
          <label class="check" id="roofopen-row"><input id="roofopen" type="checkbox" data-testid="roofopen" /><span id="l-roofopen"></span></label>
          <label class="check" id="gates-row"><input id="gates" type="checkbox" data-testid="gates" /><span id="l-gates"></span></label>
          <label class="check" id="boards-row"><input id="boards" type="checkbox" data-testid="boards" /><span id="l-boards"></span></label>
          <label id="lighting-row"><span id="l-lighting"></span><select id="lighting" data-testid="lighting"><option value="off"></option><option value="night"></option><option value="game"></option><option value="lightsDown"></option><option value="intro"></option><option value="concert"></option></select></label>
          <label id="wash-row"><span id="l-wash"></span><select id="wash" data-testid="wash"><option value="none"></option><option value="purple"></option><option value="magenta"></option><option value="blue"></option><option value="white"></option></select></label>
          <label><span id="l-language"></span><select id="language"><option value="en">English</option><option value="ja">日本語</option></select></label>
          <label><span id="l-theme"></span><select id="theme"><option value="auto"></option><option value="light"></option><option value="dark"></option></select></label>
        </div>
      </details>
      <p class="note" id="credit" data-testid="credit"></p>
      <p class="note"><a href="./stadiums.html" id="stadiums"></a> · <a href="./docs/district.html" id="docs"></a></p>
    </main>
    <script type="module">
      // A district: several real venues of one city on one plan, each at its real position and orientation (OpenStreetMap, ODbL 1.0), to look down on in 2D or turn around together in 3D. The page only asks the package to draw
      // (`drawDistrict`, `mountDistrictTurn`): the venues, the mode and the turn are options. What is chosen lives in the address; nothing is sent anywhere and nothing is stored.
      import { DISTRICT_IDS, districtMember, mountDistrict, mountDistrictTurn, OUTSIDE_LEVELS, OUTSIDE_VENUES, planDistrict, unknownVenues, VENUE_ATTRIBUTION } from "./dist/district-entry.js";
      import { TOKYO_DOME_CITY } from "./dist/plateau-entry.js";
      import { VANCOUVER_CENTRE } from "./dist/osm-entry.js";
      import { hoverOf, keepCamera, wayOf, writeWay } from "./turn-way.js";
      import { lightingFor, lightingOfAddress } from "./lighting.js";
      import { STADIUMS } from "./dist/stadiums-entry.js";
      import { quietTitles } from "./quiet.js";
      quietTitles();

      const WORDS = {
        en: {
          title: "A district of real venues",
          pageTitle: "Kyogijo Stadiums: a district of real venues",
          pageDescription: "Several real venues of one city on one plan at their real relative positions and orientations, from OpenStreetMap: BC Place and Rogers Arena side by side in Vancouver, to turn around together in 3D or look down on in 2D.",
          lede: "Each venue is the one its own page draws, put where it stands and turned as it lies, from the outlines OpenStreetMap maps. Among neighbours the plan is fitted close round the buildings; in a city it keeps the real distances, with a grid of kilometres. Never a street map and no mark of a club, a league or a tournament.",
          back: "Back to the Kyogijo Stadiums demo", docs: "The district page of the docs", stadiums: "BC Place on its own",
          factsTitle: "What the plan is made from", edit: "Choose", venues: "Venues", mode: "Fit", turn: "Turn", labels: "Names beside the venues", context: "Surrounding buildings and streets", roofopen: "Retractable roof open (3D)", gates: "Gates, and the way a queue runs", kodokan: "Kodokan: the main dojo, in the air on the 7th floor", building: "Kodokan building", xray: "See-through walls", solid: "Solid", none: "Off (the dojo alone)", view: "View", viewpoint: "Viewpoint", roof: "Roofs and walls (3D)", boards: "LED boards (3D)", lighting: "Lighting", lighting_off: "Lighting: off", lighting_night: "Night", lighting_game: "Game", lighting_lightsDown: "Lights down", lighting_intro: "Intro", lighting_concert: "Concert", wash: "Surface light colour", wash_none: "as the preset", wash_purple: "Purple", wash_magenta: "Magenta", wash_blue: "Blue", wash_white: "White", language: "Language", theme: "Theme", auto: "Follow the device", light: "Light", dark: "Dark",
          neighbours: "Neighbours: close round the buildings", city: "City: the real distances, with a grid", north: "North at the top", fit: "Long way across the page",
          overhead: "Overhead", broadcast: "Broadcast", end: "End", corner: "Corner", formLabel: "How the district is shown",
          venue: "Venue", seats: "Seats", rink: "Surface", orientation: "How it lies", cfl: "football field", nfl: "football field", soccer: "soccer pitch", mlb: "baseball field", boxing: "boxing ring", dojo: "main dojo, 7th floor (420 jō)", nhl: "ice hockey rink", opening: "along the roof's opening", pitch: "as the pitch is mapped", infield: "from the mapped infield", building: "inferred from the building", none: "not known, east-west", nonePark: "not known, fitted to the building",
          between: "The middles of {a} and {b} are {metres} metres apart.", pickOne: "Choose at least one venue.",
          outside: "People outside", outsideNote: "A crowd outside is drawn for BC Place and Rogers Arena for now; the other venues come later.",
          outsideCount: "{people} people outside, {percent}% of the {seats} seats. They stand on sidewalks, plazas and the venues' grounds, never on a road. Walkable ground: OpenStreetMap.", outsideNone: "Nobody outside. Choose a share of the seats to put outside the venues.",
          credit: "Building outlines, roofs and the ground a crowd outside may stand on (sidewalks, plazas, roads, buildings): (c) OpenStreetMap contributors, ODbL 1.0, openstreetmap.org/copyright. Seats, tiers and roofs: Wikidata (CC0) and the English Wikipedia article each venue cites, in our own words.",
          presets: { pair: "BC Place and Rogers Arena", soccer: "BC Place for soccer and Rogers Arena", alone: "Rogers Arena alone", sodo: "Seattle SoDo: T-Mobile Park and Lumen Field", seattle: "Seattle city: all three venues", tokyo: "Tokyo Dome City: Tokyo Dome and Korakuen Hall", tokyokodokan: "Tokyo Dome City and the Kodokan", kodokan: "Tokyo Dome City and the Kodokan" },
        },
        ja: {
          title: "実在の会場の地区",
          pageTitle: "競技場 Kyogijo Stadiums：実在の会場の地区",
          pageDescription: "同じ都市の実在の会場を、OpenStreetMapをもとに、実際の位置と向きのとおり1枚の図に並べます。バンクーバーのBCプレイスとロジャース・アリーナ、シアトルの3つの会場、東京ドームと後楽園ホールなどを、3Dで一緒に回したり、2Dで真上から見たりできます。",
          lede: "各会場は、それぞれのページで描いたものを、OpenStreetMapに記録された実際の位置と向きに置いています。隣り合う会場は建物のすぐ近くまで寄せ、都市では実際の距離を保って1km方眼を添えます。道路地図ではなく、クラブ・リーグ・大会のマークもありません。",
          back: "競技場 Kyogijo Stadiums のデモに戻る", docs: "ドキュメントの「会場の地区」ページ", stadiums: "BCプレイス単独のページ",
          factsTitle: "この図の元になった情報", edit: "選ぶ", venues: "会場", mode: "縮尺の取り方", turn: "回転", labels: "会場名を添える", context: "周辺の建物と道路", roofopen: "開閉式屋根を開ける（3D）", gates: "ゲートと行列の向き", kodokan: "講道館：7階の大道場を空中に描く", building: "講道館の建物", xray: "壁を透かす", solid: "壁を不透明にする", none: "なし（大道場のみ）", view: "表示", viewpoint: "視点", roof: "屋根と壁（3D）", boards: "LEDビジョン（3D）", lighting: "照明", lighting_off: "照明：なし", lighting_night: "夜間", lighting_game: "試合中", lighting_lightsDown: "場内暗転", lighting_intro: "選手紹介", lighting_concert: "コンサート", wash: "競技面の照明の色", wash_none: "プリセットのまま", wash_purple: "紫", wash_magenta: "マゼンタ", wash_blue: "青", wash_white: "白", language: "言語", theme: "テーマ", auto: "端末に合わせる", light: "ライト", dark: "ダーク",
          neighbours: "隣り合う会場：建物のすぐ近くまで寄せる", city: "都市：実際の距離を保ち、方眼を添える", north: "北を上にする", fit: "長い方を横に置く",
          overhead: "真上", broadcast: "中継", end: "エンド", corner: "コーナー", formLabel: "地区の見せ方",
          venue: "会場", seats: "座席数", rink: "競技面", orientation: "向き", cfl: "フットボール場", nfl: "フットボール場", soccer: "サッカー場", mlb: "野球場", boxing: "ボクシングのリング", dojo: "大道場（7階、420畳）", nhl: "アイスホッケーのリンク", opening: "屋根の開口部に沿う", pitch: "地図のピッチのとおり", infield: "地図の内野から", building: "建物から推定", none: "不明（東西）", nonePark: "不明（建物に合わせた向き）",
          between: "{a}と{b}の中心は{metres}m離れています。", pickOne: "会場を1つ以上選んでください。",
          outside: "会場の外の人出", outsideNote: "会場の外の人出は、今のところBCプレイスとロジャーズ・アリーナの周辺で描けます。ほかの会場には、まだ対応していません。",
          outsideCount: "会場の外に{people}人（{seats}席の{percent}％）。人が立つのは歩道、広場、会場の敷地だけで、車道には立ちません。人が立てる場所のデータは、OpenStreetMapをもとにしています。", outsideNone: "会場の外には誰もいません。座席数に対する割合を選ぶと、その分の人が外に出ます。",
          credit: "建物の輪郭、屋根、および会場の外で人が立てる場所を判断するためのデータ（歩道、広場、道路、建物）：(c) OpenStreetMap contributors（ODbL 1.0、openstreetmap.org/copyright）。座席数、スタンドの層、屋根：Wikidata（CC0）と、各会場が出典としている英語版ウィキペディアの記事（内容は自分たちの言葉でまとめ直しています）。",
          presets: { pair: "BCプレイスとロジャース・アリーナ", soccer: "サッカー用のBCプレイスとロジャース・アリーナ", alone: "ロジャース・アリーナのみ", sodo: "シアトルのSoDo：T-モバイル・パークとルーメン・フィールド", seattle: "シアトル市内：3つの会場", tokyo: "東京ドームシティ：東京ドームと後楽園ホール", tokyokodokan: "東京ドームシティと講道館" },
        },
      };
      /** The choices a preset sets: the venues, and the fit (neighbours where the venues are close, a city where they are kilometres apart). */
      const PRESETS = {
        pair: { venues: ["bc-place:cfl", "rogers-arena"], mode: "neighbours", context: true },
        soccer: { venues: ["bc-place:soccer", "rogers-arena"], mode: "neighbours", context: true },
        alone: { venues: ["rogers-arena"], mode: "neighbours", context: true },
        sodo: { venues: ["t-mobile-park:mlb", "lumen-field:nfl"], mode: "neighbours" },
        seattle: { venues: ["t-mobile-park:mlb", "lumen-field:nfl", "climate-pledge-arena"], mode: "city" },
        tokyo: { venues: ["tokyo-dome:mlb", "korakuen-hall:boxing"], mode: "neighbours", context: true },
        tokyokodokan: { venues: ["tokyo-dome:mlb", "korakuen-hall:boxing", "kodokan"], mode: "neighbours", context: true },
      };
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const words = () => WORDS[$("language").value];
      const setSelect = (id, value, allowed) => { if (allowed.includes(value)) $(id).value = value; };
      const fillIn = (text, values) => text.replace(/\{(\w+)\}/g, (_, key) => String(values[key]));
      /** Every venue the page offers, by the key a district takes: the arenas, and each configuration of a stadium. */
      const KEYS = DISTRICT_IDS.flatMap((id) => (Object.hasOwn(STADIUMS, id) ? Object.keys(STADIUMS[id].configs).map((config) => `${id}:${config}`) : [id]));
      const asked = (params.get("venues") ?? PRESETS.pair.venues.join(",")).split(",").map((v) => (Object.hasOwn(STADIUMS, v) ? `${v}:${Object.keys(STADIUMS[v].configs)[0]}` : v));
      const state = { venues: asked.filter((v, i) => KEYS.includes(v) && asked.indexOf(v) === i) };
      let turn;
      let flat;
      let turnKey = "";
      /** The camera the reader chose: kept when the view is mounted again for another choice of venues, and the turn made by hand is in the address. */
      const camera = keepCamera();
      /** The viewpoint the view was last put on, so that only a new choice of it moves the camera. */
      let viewpointNow = "";
      /** The share of the seats outside, in percent: the address's, one of the levels, else nobody. */
      state.outside = OUTSIDE_LEVELS.includes(Number(params.get("outside"))) ? Number(params.get("outside")) : 0;
      const masked = () => state.venues.some((key) => OUTSIDE_VENUES.includes(key.split(":")[0]));
      /** Whether the venues chosen have buildings round them to show (Tokyo Dome City's, from Project PLATEAU): the choice is on for them unless the address says context=0. */
      const idOf = (key) => key.split(":")[0];
      /** Whether the venues chosen are Tokyo Dome City's (with PLATEAU's buildings round them): the Kodokan's choice is theirs. */
      const hasTokyo = () => state.venues.some((key) => ["tokyo-dome", "korakuen-hall", "kodokan"].includes(idOf(key)));
      /** The buildings and streets the venues chosen have round them: Tokyo Dome City's (Project PLATEAU) or downtown Vancouver's (OpenStreetMap). */
      const contextAreas = () => (hasTokyo() ? [TOKYO_DOME_CITY] : state.venues.some((key) => ["bc-place", "rogers-arena"].includes(idOf(key))) ? [VANCOUVER_CENTRE] : []);
      const hasContext = () => contextAreas().length > 0;
      /** Whether a venue chosen has gates (`venueGates`) or a retractable roof that opens. */
      const hasGates = () => state.venues.some((key) => ["bc-place", "rogers-arena"].includes(idOf(key)));
      const hasOpening = () => state.venues.some((key) => ["bc-place", "t-mobile-park"].includes(idOf(key)));
      /** The Kodokan's building, round its main dojo in the air: see-through by default, solid, or left out. */
      const BUILDINGS = ["xray", "solid", "none"];
      const hasKodokan = () => state.venues.includes("kodokan");
      const contextOn = () => hasContext() && $("context").checked;

      setSelect("mode", params.get("mode"), ["neighbours", "city"]);
      setSelect("turn", params.get("turn"), ["0", "auto"]);
      setSelect("view", params.get("view"), ["2d", "3d"]);
      setSelect("viewpoint", params.get("viewpoint"), ["overhead", "broadcast", "end", "corner"]);
      setSelect("theme", params.get("theme"), ["light", "dark"]);
      setSelect("language", params.get("lang"), ["en", "ja"]);
      $("labels").checked = params.get("labels") === "1" || (params.get("labels") === null && params.get("mode") === "city");
      $("roof").checked = params.get("roof") !== "0";
      $("roofopen").checked = params.get("roofopen") === "1";
      $("gates").checked = params.get("gates") === "1";
      $("context").checked = params.get("context") !== "0";
      setSelect("building", params.get("building"), ["xray", "solid", "none"]);
      $("boards").checked = params.get("boards") === "1";
      $("lighting").value = lightingOfAddress(params);
      $("wash").value = ["purple", "magenta", "blue", "white"].includes(params.get("wash")) ? params.get("wash") : "none";

      const nameOf = (key) => districtMember(key, $("language").value).name[$("language").value];

      function labelPage() {
        const w = words();
        for (const [id, key] of [["title", "title"], ["lede", "lede"], ["back", "back"], ["docs", "docs"], ["stadiums", "stadiums"], ["l-facts", "factsTitle"], ["l-edit", "edit"], ["l-venues", "venues"], ["l-roofopen", "roofopen"], ["l-gates", "gates"], ["l-outside", "outside"], ["l-mode", "mode"], ["l-turn", "turn"], ["l-labels", "labels"], ["l-context", "context"], ["l-kodokan", "kodokan"], ["l-building", "building"], ["l-view", "view"], ["l-viewpoint", "viewpoint"], ["l-roof", "roof"], ["l-boards", "boards"], ["l-lighting", "lighting"], ["l-wash", "wash"], ["l-language", "language"], ["l-theme", "theme"], ["credit", "credit"]]) $(id).textContent = w[key];
        for (const option of $("building").options) option.textContent = w[option.value];
        for (const select of ["viewpoint", "theme", "mode"]) for (const option of $(select).options) option.textContent = w[option.value];
        for (const option of $("wash").options) option.textContent = w[`wash_${option.value}`];
        for (const option of $("lighting").options) option.textContent = w[`lighting_${option.value}`];
        $("turn").options[0].textContent = w.north;
        $("turn").options[1].textContent = w.fit;
        document.documentElement.lang = $("language").value;
        document.title = w.pageTitle;
        document.querySelector('meta[name="description"]').setAttribute("content", w.pageDescription);
        $("edit").setAttribute("aria-label", w.formLabel);
        $("tabs").replaceChildren(...Object.keys(PRESETS).map((preset) => {
          const button = document.createElement("button");
          button.type = "button";
          button.role = "tab";
          button.dataset.preset = preset;
          button.textContent = w.presets[preset];
          button.setAttribute("aria-selected", String(PRESETS[preset].venues.join() === state.venues.join() && PRESETS[preset].mode === $("mode").value));
          return button;
        }));
        $("picks").replaceChildren(...KEYS.map((key) => {
          const label = document.createElement("label");
          label.className = "check";
          const box = document.createElement("input");
          box.type = "checkbox";
          box.dataset.key = key;
          box.checked = state.venues.includes(key);
          const text = document.createElement("span");
          const member = districtMember(key, $("language").value);
          text.textContent = member.kind === "arena" || member.config === undefined ? nameOf(key) : `${nameOf(key)} (${w[member.config]})`;
          label.append(box, text);
          return label;
        }));
      }

      function listFacts(plan) {
        const w = words();
        const lang = $("language").value;
        $("head").replaceChildren(...[w.venue, w.rink, w.seats, w.orientation].map((text) => { const th = document.createElement("th"); th.textContent = text; return th; }));
        $("list").replaceChildren(...plan.members.map((placed) => {
          const m = placed.member;
          const tr = document.createElement("tr");
          const sport = m.options.sport;
          for (const text of [nameOf(m.key), w[sport], m.seats.toLocaleString(lang), m.basis === "none" ? (m.kind === "park" ? w.nonePark : w.none) : `${w[m.basis]}, ${m.heading}°`]) { const td = document.createElement("td"); td.textContent = text; tr.append(td); }
          return tr;
        }));
        $("between").textContent = plan.between.map((b) => fillIn(w.between, { a: nameOf(b.a), b: nameOf(b.b), metres: Math.round(b.metres).toLocaleString(lang) })).join(" ");
      }

      function syncUrl() {
        const next = new URLSearchParams();
        if (state.venues.join() !== PRESETS.pair.venues.join()) next.set("venues", state.venues.join(","));
        if ($("mode").value !== "neighbours") next.set("mode", $("mode").value);
        if ($("turn").value !== "0") next.set("turn", $("turn").value);
        if ($("labels").checked !== ($("mode").value === "city")) next.set("labels", $("labels").checked ? "1" : "0");
        if ($("view").value === "3d") next.set("view", "3d");
        if ($("viewpoint").value !== "overhead") next.set("viewpoint", $("viewpoint").value);
        if (!$("roof").checked) next.set("roof", "0");
        if (hasContext() && !$("context").checked) next.set("context", "0");
        if (hasOpening() && $("roofopen").checked) next.set("roofopen", "1");
        if (hasGates() && $("gates").checked) next.set("gates", "1");
        if (hasKodokan() && $("building").value !== "xray") next.set("building", $("building").value);
        if ($("boards").checked) next.set("boards", "1");
        if ($("lighting").value !== "off") next.set("lighting", $("lighting").value);
        if ($("lighting").value !== "off" && $("wash").value !== "none") next.set("wash", $("wash").value);
        if (masked() && state.outside > 0) next.set("outside", String(state.outside));
        if ($("language").value === "ja") next.set("lang", "ja");
        if ($("theme").value !== "auto") next.set("theme", $("theme").value);
        writeWay(next);
        camera.write(next);
        history.replaceState(null, "", next.size === 0 ? location.pathname : `?${next}`);
      }

      /** The boards the page asks of the 3D view: a plain score on, or off. A change goes in with `update`, so the view goes on turning. */
      const boardsNow = () => ($("boards").checked ? { score: [3, 2] } : false);
      const lightingNow = () => lightingFor({ lighting: $("lighting").value, wash: $("wash").value });

      /** The bar of levels: the buttons, which one is pressed, and what the level means in people. */
      function paintOutsideBar(plan) {
        const w = words();
        const lang = $("language").value;
        const on = masked();
        $("outside-bar").hidden = !on;
        $("outside-note").hidden = on;
        $("outside-note").textContent = w.outsideNote;
        if (!on) return;
        $("outside-levels").replaceChildren(...OUTSIDE_LEVELS.map((level) => {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.level = String(level);
          button.textContent = `${level}%`;
          button.setAttribute("aria-pressed", String(level === state.outside));
          return button;
        }));
        const seats = plan.members.filter((p) => OUTSIDE_VENUES.includes(p.member.id)).reduce((sum, p) => sum + p.member.seats, 0);
        $("outside-count").textContent = state.outside === 0 ? w.outsideNone : fillIn(w.outsideCount, { people: Math.round((seats * state.outside) / 100).toLocaleString(lang), percent: state.outside, seats: seats.toLocaleString(lang) });
        $("outside-bar").dataset.level = String(state.outside);
      }

      /** What the crowd's last paint cost, written on the bar for a person or a test to read. */
      function noteCost() {
        const cost = (turn ?? flat)?.outsideCost?.();
        if (cost === undefined) delete $("outside-bar").dataset.costMs;
        else {
          $("outside-bar").dataset.costMs = cost.ms.toFixed(1);
          $("outside-bar").dataset.people = String(cost.people);
        }
      }

      function draw() {
        const theme = $("theme").value;
        if (theme === "auto") delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = theme;
        const three = $("view").value === "3d";
        $("viewpoint-row").hidden = !three;
        $("roof-row").hidden = !three;
        $("context-row").hidden = !hasContext();
        $("kodokan-row").hidden = !hasTokyo();
        $("roofopen-row").hidden = !three || !hasOpening();
        $("gates-row").hidden = !hasGates();
        $("kodokan").checked = hasKodokan();
        $("building-row").hidden = !hasKodokan();
        $("boards-row").hidden = !three;
        $("lighting-row").hidden = !three;
        $("wash-row").hidden = !three;
        $("error").hidden = true;
        document.body.dataset.view = $("view").value;
        const stage = $("stage");
        if (state.venues.length === 0 || unknownVenues(state.venues).length > 0) {
          camera.carry(turn);
          if (turn !== undefined) { turn.destroy(); turn = undefined; }
          if (flat !== undefined) { flat.destroy(); flat = undefined; }
          stage.replaceChildren();
          $("outside-bar").hidden = true;
          $("error").textContent = words().pickOne;
          $("error").hidden = false;
          $("list").replaceChildren();
          $("between").textContent = "";
          syncUrl();
          document.body.dataset.ready = "true";
          return;
        }
        // A district with a mask asks for the crowd at every level, 0 included: the plan keeps room round the buildings for it, so that nothing moves when the level does.
        const options = { venues: state.venues, mode: $("mode").value, turn: $("turn").value === "auto" ? "auto" : 0, labels: $("labels").checked, language: $("language").value, ...(masked() ? { outside: { level: state.outside } } : {}), ...(theme === "auto" ? {} : { theme }), ...(contextOn() ? { context: contextAreas() } : {}), ...(hasGates() && $("gates").checked ? { gates: true } : {}), ...(hasKodokan() ? { building: $("building").value } : {}) };
        try {
          const plan = planDistrict(options);
          if (three) {
            const settings = { preset: $("viewpoint").value, venue: { roof: $("roof").checked, roofOpen: $("roofopen").checked, boards: boardsNow(), lighting: lightingNow() }, ...wayOf(syncUrl) };
            const key = JSON.stringify([state.venues, options.mode, options.turn, $("roof").checked, contextOn(), hasKodokan() ? $("building").value : "", options.gates === true]);
            // Another choice of venues draws the scene again, and the camera goes on where the reader left it: the view is opened on it.
            if (turn !== undefined && turnKey !== key) { camera.carry(turn); turn.destroy(); turn = undefined; }
            if (turn === undefined) {
              if (flat !== undefined) { flat.destroy(); flat = undefined; }
              stage.innerHTML = '<div id="three"></div>';
              turnKey = key;
              turn = mountDistrictTurn($("three"), options, {
                ...settings,
                ...camera.settings(),
                onChange: (view, preset) => {
                  // A viewpoint chosen on the view's own buttons is the page's too.
                  if (preset !== undefined && $("viewpoint").value !== preset) $("viewpoint").value = preset;
                  viewpointNow = $("viewpoint").value;
                  camera.changed(view, preset, syncUrl);
                },
              });
              viewpointNow = $("viewpoint").value;
              hoverOf($("three"), turn);
            } else {
              turn.update(options, { venue: { roofOpen: $("roofopen").checked, boards: boardsNow(), lighting: lightingNow() } });
              // Only a viewpoint chosen from the list moves the camera: anything else leaves it where it is.
              if ($("viewpoint").value !== viewpointNow) {
                viewpointNow = $("viewpoint").value;
                camera.chose();
                turn.preset(viewpointNow);
              }
            }
          } else {
            camera.carry(turn);
            if (turn !== undefined) { turn.destroy(); turn = undefined; }
            if (flat !== undefined) flat.destroy();
            flat = mountDistrict(stage, options);
          }
          if (three && flat !== undefined) { flat.destroy(); flat = undefined; }
          listFacts(plan);
          paintOutsideBar(plan);
          noteCost();
          $("credit").textContent = plan.context === undefined ? words().credit : `${words().credit} ${plan.context.attribution[$("language").value].join(" ")}`;
        } catch (error) {
          $("error").textContent = String(error.message);
          $("error").hidden = false;
        }
        syncUrl();
        const back = new URLSearchParams();
        if ($("language").value === "ja") back.set("lang", "ja");
        $("back").href = back.size === 0 ? "./" : `./?${back}`;
        document.body.dataset.ready = "true";
      }

      labelPage();
      $("tabs").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-preset]");
        if (button === null) return;
        const preset = PRESETS[button.dataset.preset];
        state.venues = [...preset.venues];
        $("mode").value = preset.mode;
        $("labels").checked = preset.mode === "city";
        $("context").checked = preset.context === true;
        $("building").value = "xray";
        labelPage();
        draw();
      });
      $("picks").addEventListener("input", (event) => {
        const box = event.target.closest("input[data-key]");
        if (box === null) return;
        const next = KEYS.filter((key) => (key === box.dataset.key ? box.checked : state.venues.includes(key)));
        // A stadium is in a district once: choosing a configuration of it takes the other away.
        const stadium = box.dataset.key.split(":")[0];
        state.venues = next.filter((key) => key === box.dataset.key || key.split(":")[0] !== stadium || !box.checked);
        labelPage();
        draw();
      });
      $("outside-levels").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-level]");
        if (button === null) return;
        state.outside = Number(button.dataset.level);
        // Only the crowd changes: the plan or the view is not drawn again, so that a turn goes on.
        (turn ?? flat)?.setOutside(state.outside);
        paintOutsideBar(planDistrict({ venues: state.venues, mode: $("mode").value, turn: $("turn").value === "auto" ? "auto" : 0, outside: { level: state.outside } }));
        noteCost();
        syncUrl();
        document.querySelector('#outside-levels button[aria-pressed="true"]')?.focus();
      });
      $("kodokan").addEventListener("input", () => {
        state.venues = KEYS.filter((key) => (key === "kodokan" ? $("kodokan").checked : state.venues.includes(key)));
        labelPage();
        draw();
      });
      $("mode").addEventListener("input", () => { $("labels").checked = $("mode").value === "city"; labelPage(); draw(); });
      for (const id of ["turn", "labels", "context", "gates", "roofopen", "building", "view", "viewpoint", "roof", "boards", "lighting", "wash", "theme"]) $(id).addEventListener("input", draw);
      $("language").addEventListener("input", () => { labelPage(); draw(); });
      draw();
    </script>
  </body>
</html>

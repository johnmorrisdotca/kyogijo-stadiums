<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kyogijo Stadiums: real stadiums and ballparks</title>
    <meta name="description" content="BC Place, Lumen Field and T-Mobile Park drawn inside the real outline of their buildings from OpenStreetMap, with their roofs, the field lying as the sources say and a plausible bowl of the seats of each configuration, in 2D and in 3D." />
    <style>
      :root { color-scheme: light dark; --bg: #f6f4ee; --ink: #10151b; --muted: #434b54; --card: #fff; --line: #b9b3a3; --accent: #1f5fa8; --tab: #10151b; --tab-ink: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d1218; --ink: #f6f3ea; --muted: #bcc3cb; --card: #18212a; --line: #475463; --accent: #7fb2ee; --tab: #f6f3ea; --tab-ink: #0d1218; } }
      :root[data-theme="light"] { color-scheme: light; --bg: #f6f4ee; --ink: #10151b; --muted: #434b54; --card: #fff; --line: #b9b3a3; --accent: #1f5fa8; --tab: #10151b; --tab-ink: #fff; }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #0d1218; --ink: #f6f3ea; --muted: #bcc3cb; --card: #18212a; --line: #475463; --accent: #7fb2ee; --tab: #f6f3ea; --tab-ink: #0d1218; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
      main { max-width: 1280px; margin: 0 auto; padding: 12px 16px 24px; }
      h1 { font-size: 1.4rem; margin: 0 0 2px; }
      p.lede { margin: 0 0 12px; color: var(--muted); }
      .back { margin: 0 0 6px; }
      a { color: var(--accent); }
      [hidden] { display: none !important; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      #tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
      #tabs button { font: inherit; font-size: 1rem; font-weight: 800; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--tab); background: var(--card); color: var(--ink); cursor: pointer; }
      #tabs button[aria-selected="true"] { background: var(--tab); color: var(--tab-ink); }
      #stage { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
      #stage > svg.kyogijo { display: block; width: 100%; height: auto; max-height: calc(100vh - 190px); }
      .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px; margin: 10px 0 0; }
      label { display: grid; gap: 4px; min-width: 0; font-size: .9rem; color: var(--muted); }
      label.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
      select { width: 100%; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 44px; }
      input[type="checkbox"] { width: 22px; height: 22px; }
      details { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
      summary { cursor: pointer; min-height: 36px; font-weight: 700; display: flex; align-items: center; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 8px 0; }
      dt { color: var(--muted); }
      dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
      .note { color: var(--muted); font-size: .9rem; margin: 8px 0; }
      #error { color: #c0392b; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p class="back"><a href="./" id="back" data-testid="back"></a></p>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
      <div id="stadium-tabs" role="tablist" data-testid="stadium-tabs"></div>
      <div id="tabs" role="tablist" data-testid="tabs"></div>
      <p id="error" role="alert" hidden></p>
      <div id="stage" data-testid="stage"></div>
      <details id="facts" open>
        <summary id="l-facts"></summary>
        <dl id="list" data-testid="facts"></dl>
      </details>
      <details id="edit" open>
        <summary id="l-edit"></summary>
        <div class="controls">
          <label><span id="l-view"></span><select id="view"><option value="2d">2D</option><option value="3d">3D</option></select></label>
          <label id="viewpoint-row"><span id="l-viewpoint"></span><select id="viewpoint"><option value="overhead"></option><option value="broadcast"></option><option value="end"></option><option value="corner"></option></select></label>
          <label class="check" id="roof-row"><input id="roof" type="checkbox" /><span id="l-roof"></span></label>
          <label class="check" id="open-row"><input id="open" type="checkbox" /><span id="l-open"></span></label>
          <label><span id="l-language"></span><select id="language"><option value="en">English</option><option value="ja">日本語</option></select></label>
          <label><span id="l-theme"></span><select id="theme"><option value="auto"></option><option value="light"></option><option value="dark"></option></select></label>
        </div>
      </details>
      <p class="note" id="credit" data-testid="credit"></p>
      <p class="note"><a href="./district.html" id="district" data-testid="district"></a> · <a href="./docs/stadiums.html" id="docs"></a></p>
    </main>
    <script type="module">
      // The real stadiums: BC Place, Lumen Field and T-Mobile Park, each drawn inside the outline of its building (OpenStreetMap, ODbL 1.0), the field lying as the sources say, with its roof and a plausible bowl of the seats of
      // each configuration. The page only asks the package to draw: `crowd: { real: true }` and a `stadium` (or a `park`) in the options. What is chosen lives in the address; nothing is sent anywhere and nothing is stored.
      import { drawKyogijo } from "./dist/index.js";
      import { STADIUMS, STADIUM_IDS, stadiumConfigs, stadiumKind, stadiumNames } from "./dist/stadiums-entry.js";
      import { mountKyogijoTurn } from "./dist/turn-entry.js";
      import { quietTitles } from "./quiet.js";
      quietTitles();

      const WORDS = {
        en: {
          title: "Real stadiums and ballparks",
          pageTitle: "Kyogijo Stadiums: real stadiums and ballparks",
          pageDescription: "BC Place, Lumen Field and T-Mobile Park drawn inside the real outline of their buildings from OpenStreetMap, with their roofs, the field lying as the sources say and a plausible bowl of the seats of each configuration, in 2D and in 3D.",
          lede: "Each stadium is drawn inside the outline of its building, as OpenStreetMap maps it, with the field lying as the roof's opening, the pitch or the infield says and a bowl of the seats the sources give for each configuration. The bowl is a plausible one, never a seat map: no section, row or seat of a real plan, and no mark of a club, a league or a tournament.",
          back: "Back to the Kyogijo Stadiums demo", docs: "The real stadiums page of the docs", district: "Beside its neighbours, in the district view",
          factsTitle: "What the drawing is made from", edit: "View", view: "View", viewpoint: "Viewpoint", roof: "Roof and walls (3D)", open: "Roof open (3D)", language: "Language", theme: "Theme", auto: "Follow the device", light: "Light", dark: "Dark",
          overhead: "Overhead", broadcast: "Broadcast", end: "End", corner: "Corner", formLabel: "How the stadium is shown",
          cfl: "Football field", nfl: "Football field", soccer: "Soccer pitch", mlb: "Baseball field",
          stadium: "Stadium", city: "City", seats: "Seats in this configuration", bowls: "Seating bowls", roofKind: "Roof", roofDetail: "The roof", orientation: "How the field lies", outline: "Building outline", pitch: "The field",
          documented: "a source says so", plausible: "ours, plausible", wikipedia: "English Wikipedia", wikidata: "Wikidata",
          cable: "retractable, supported by cables", canopy: "a canopy over some of the stands", panels: "retractable, in four sections", fixed: "fixed",
          opening_: "from the roof's opening, which is the field's size", pitch_: "as OpenStreetMap maps the pitch", infield: "from the infield OpenStreetMap maps and the building's outline", building: "inferred from the building's long axis", none: "not known: drawn east-west, north at the top",
          seatsText: "{seats} ({source})", bowlsText: "{count} ({basis})", bowlsLower: "; the lower bowl {lower}", bowlsClosed: "; the bowl holds {bowl}, the rest closed", bowlsLevels: "; by level {tiers}",
          cableText: "an opening of {length} by {width} metres, the size of the field (the article); the fabric closes it or gathers into its pod",
          canopyText: "covers {cover} percent of the seats and leaves the field open (the article); the roof's outline and heights are OpenStreetMap's",
          panelsText: "its bottom {bottom} feet and its top {top} feet above the field, resting over the railway to the east when open (the article)",
          orientationText: "{how}, the field along {heading} degrees from north", orientationPark: "{how}, home plate to centre field {heading} degrees from north",
          outlineText: "OpenStreetMap {way}, read {read}",
          pitchText: { cfl: "150 by 65 yards with 20-yard end zones", nfl: "120 by 53.3 yards", soccer: "the size published for the ground, 116 by 75 yards at Lumen Field and the international 105 by 68 metres elsewhere", mlb: "the fence at the distances published for the park" },
          credit: "Building outlines, roofs and pitches: (c) OpenStreetMap contributors, ODbL 1.0, openstreetmap.org/copyright. Seats, bowls and roofs: Wikidata (CC0) and the English Wikipedia article each stadium cites, in our own words.",
        },
        ja: {
          title: "実在のスタジアムと球場",
          pageTitle: "競技場 Kyogijo Stadiums：実在のスタジアムと球場",
          pageDescription: "BCプレイス、ルーメン・フィールド、T-モバイル・パークを、OpenStreetMapの建物の輪郭の内側に描きます。屋根、資料に基づくフィールドの向き、構成ごとの座席数から推定したスタンドを、2Dと3Dで見られます。",
          lede: "スタジアムは、OpenStreetMapに記録された建物の輪郭の内側に、屋根の開口部・ピッチ・内野が示す向きにフィールドを置き、公表されている構成ごとの座席数からスタンドを推定して描いています。座席表ではありません。実際のブロック・列・座席は描いておらず、クラブ・リーグ・大会のマークもありません。",
          back: "競技場 Kyogijo Stadiums のデモに戻る", docs: "ドキュメントの「実在のスタジアム」ページ", district: "近くの会場と並べた地区の表示",
          factsTitle: "この図の元になった情報", edit: "表示", view: "表示", viewpoint: "視点", roof: "屋根と壁（3D）", open: "屋根を開く（3D）", language: "言語", theme: "テーマ", auto: "端末に合わせる", light: "ライト", dark: "ダーク",
          overhead: "真上", broadcast: "中継", end: "エンド", corner: "コーナー", formLabel: "スタジアムの見せ方",
          cfl: "フットボール場", nfl: "フットボール場", soccer: "サッカー場", mlb: "野球場",
          stadium: "スタジアム", city: "都市", seats: "この構成の座席数", bowls: "客席の層", roofKind: "屋根", roofDetail: "屋根の詳細", orientation: "フィールドの向き", outline: "建物の輪郭", pitch: "フィールド",
          documented: "資料に記載あり", plausible: "推定", wikipedia: "Wikipedia英語版", wikidata: "Wikidata",
          cable: "ケーブルで支える開閉式", canopy: "観客席の一部を覆う庇", panels: "4分割の開閉式", fixed: "固定屋根",
          opening_: "屋根の開口部（フィールドと同じ大きさ）", pitch_: "OpenStreetMapに記録されたピッチ", infield: "OpenStreetMapに記録された内野と建物の輪郭", building: "建物の長軸からの推定", none: "不明（東西に配置、北が上）",
          seatsText: "{seats}席（{source}）", bowlsText: "{count}層（{basis}）", bowlsLower: "、下層は{lower}席", bowlsClosed: "、スタンドは{bowl}席分で、残りは閉鎖", bowlsLevels: "、階ごとの座席数：{tiers}",
          cableText: "開口部は{length}×{width}m（記事による、フィールドと同じ大きさ）。膜で閉じるか、収納部にたたまれる",
          canopyText: "客席の{cover}％を覆い、フィールドは開放（記事による）。屋根の輪郭と高さはOpenStreetMapによる",
          panelsText: "下端はフィールドから{bottom}フィート、上端は{top}フィート。開くと東側の線路の上に重なる（記事による）",
          orientationText: "フィールドは北から{heading}度（根拠：{how}）", orientationPark: "ホームプレートからセンターへの向きは北から{heading}度（根拠：{how}）",
          outlineText: "OpenStreetMap {way}（{read}に取得）",
          pitchText: { cfl: "150×65ヤード、エンドゾーン20ヤード", nfl: "120×53.3ヤード", soccer: "各会場で公表されている広さ（ルーメン・フィールドは116×75ヤード、ほかは国際標準の105×68m）", mlb: "球場ごとに公表されている距離に置いたフェンス" },
          credit: "建物の輪郭、屋根、ピッチ：(c) OpenStreetMap contributors（ODbL 1.0、openstreetmap.org/copyright）。座席数・層・屋根：Wikidata（CC0）と、各スタジアムが出典とするWikipedia英語版の記事（独自の言葉でまとめたもの）。",
        },
      };
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const words = () => WORDS[$("language").value];
      const setSelect = (id, value, allowed) => { if (allowed.includes(value)) $(id).value = value; };
      const fillIn = (text, values) => text.replace(/\{(\w+)\}/g, (_, key) => String(values[key]));
      const state = { stadium: STADIUM_IDS.includes(params.get("stadium")) ? params.get("stadium") : STADIUM_IDS[0], config: params.get("config") };
      if (!stadiumConfigs(STADIUMS[state.stadium]).includes(state.config)) state.config = stadiumConfigs(STADIUMS[state.stadium])[0];
      let turn;
      let turnKey = "";

      setSelect("view", params.get("view"), ["2d", "3d"]);
      setSelect("viewpoint", params.get("viewpoint"), ["overhead", "broadcast", "end", "corner"]);
      setSelect("theme", params.get("theme"), ["light", "dark"]);
      setSelect("language", params.get("lang"), ["en", "ja"]);
      $("roof").checked = params.get("roof") === "1" || params.get("open") === "1";
      $("open").checked = params.get("open") === "1";

      const nameOf = (id) => stadiumNames(STADIUMS[id])[$("language").value];
      const retractable = () => ["cable", "panels"].includes(STADIUMS[state.stadium].roof.kind);

      function labelPage() {
        const w = words();
        for (const [id, key] of [["title", "title"], ["lede", "lede"], ["back", "back"], ["docs", "docs"], ["district", "district"], ["l-facts", "factsTitle"], ["l-edit", "edit"], ["l-view", "view"], ["l-viewpoint", "viewpoint"], ["l-roof", "roof"], ["l-open", "open"], ["l-language", "language"], ["l-theme", "theme"], ["credit", "credit"]]) $(id).textContent = w[key];
        for (const select of ["viewpoint", "theme"]) for (const option of $(select).options) option.textContent = w[option.value];
        document.documentElement.lang = $("language").value;
        document.title = w.pageTitle;
        document.querySelector('meta[name="description"]').setAttribute("content", w.pageDescription);
        $("edit").setAttribute("aria-label", w.formLabel);
        $("stadium-tabs").replaceChildren(...STADIUM_IDS.map((id) => {
          const button = document.createElement("button");
          button.type = "button";
          button.role = "tab";
          button.dataset.stadium = id;
          button.textContent = nameOf(id);
          button.setAttribute("aria-selected", String(id === state.stadium));
          return button;
        }));
        $("tabs").replaceChildren(...stadiumConfigs(STADIUMS[state.stadium]).map((config) => {
          const button = document.createElement("button");
          button.type = "button";
          button.role = "tab";
          button.dataset.config = config;
          button.textContent = w[config];
          button.setAttribute("aria-selected", String(config === state.config));
          return button;
        }));
      }

      /** What the drawing is made from, as a list. */
      function listFacts() {
        const w = words();
        const lang = $("language").value;
        const s = STADIUMS[state.stadium];
        const config = s.configs[state.config];
        const axis = s.osm.axis;
        const park = stadiumKind(s) === "park";
        const num = (n) => n.toLocaleString(lang);
        let bowls = fillIn(w.bowlsText, { count: s.tiers.count, basis: w[s.tiers.basis] });
        if (s.tiers.lowerSeats !== undefined) bowls += fillIn(w.bowlsLower, { lower: num(s.tiers.lowerSeats) });
        if (s.bowlSeats !== undefined && s.bowlSeats > config.seats) bowls += fillIn(w.bowlsClosed, { bowl: num(s.bowlSeats) });
        if (s.tiers.tierSeats !== undefined) bowls += fillIn(w.bowlsLevels, { tiers: `${num(s.tiers.tierSeats.lower)} / ${num(s.tiers.tierSeats.upper)} / ${num(s.tiers.tierSeats.bleachers)}` });
        const roof = s.roof;
        const detail = roof.kind === "cable" ? fillIn(w.cableText, { length: roof.opening.length, width: roof.opening.width }) : roof.kind === "canopy" ? fillIn(w.canopyText, { cover: Math.round(roof.cover * 100) }) : roof.kind === "panels" ? fillIn(w.panelsText, { bottom: roof.bottom, top: roof.top }) : "";
        const how = { opening: w.opening_, pitch: w.pitch_, infield: w.infield, building: w.building }[axis.basis];
        const rows = [
          [w.stadium, `${nameOf(s.id)} (${s.wikidata})`],
          [w.pitch, w.pitchText[state.config]],
          [w.seats, fillIn(w.seatsText, { seats: num(config.seats), source: w[config.source] })],
          [w.bowls, bowls],
          [w.roofKind, `${w[roof.kind]} (${w[roof.basis]})`],
          ...(detail === "" ? [] : [[w.roofDetail, detail]]),
          [w.orientation, axis.basis === "none" ? w.none : fillIn(park ? w.orientationPark : w.orientationText, { how, heading: axis.heading })],
          [w.outline, fillIn(w.outlineText, { way: s.osm.source, read: s.osm.read })],
        ];
        $("list").replaceChildren(...rows.flatMap(([term, text]) => {
          const dt = document.createElement("dt");
          const dd = document.createElement("dd");
          dt.textContent = term;
          dd.textContent = text;
          return [dt, dd];
        }));
      }

      function syncUrl() {
        const next = new URLSearchParams();
        if (state.stadium !== STADIUM_IDS[0]) next.set("stadium", state.stadium);
        if (state.config !== stadiumConfigs(STADIUMS[state.stadium])[0]) next.set("config", state.config);
        if ($("view").value === "3d") next.set("view", "3d");
        if ($("viewpoint").value !== "corner") next.set("viewpoint", $("viewpoint").value);
        if ($("roof").checked) next.set("roof", "1");
        if ($("open").checked) next.set("open", "1");
        if ($("language").value === "ja") next.set("lang", "ja");
        if ($("theme").value !== "auto") next.set("theme", $("theme").value);
        history.replaceState(null, "", next.size === 0 ? location.pathname : `?${next}`);
      }

      /** The options a stadium and a configuration are drawn from: a ballpark by its `park`, any other by its `stadium`. */
      function optionsOf(theme) {
        const park = stadiumKind(STADIUMS[state.stadium]) === "park";
        return { sport: state.config, ...(park ? { park: state.stadium } : { stadium: state.stadium }), crowd: { real: true }, language: $("language").value, ...(theme === "auto" ? {} : { theme }) };
      }

      function draw() {
        const theme = $("theme").value;
        if (theme === "auto") delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = theme;
        const three = $("view").value === "3d";
        $("viewpoint-row").hidden = !three;
        $("roof-row").hidden = !three;
        $("open-row").hidden = !three || !$("roof").checked || !retractable();
        if (!$("roof").checked || !retractable()) $("open").checked = false;
        const stage = $("stage");
        $("error").hidden = true;
        const options = optionsOf(theme);
        document.body.dataset.view = $("view").value;
        try {
          if (three) {
            const settings = { preset: $("viewpoint").value, ...($("roof").checked ? { venue: { roof: true, roofOpen: $("open").checked } } : {}) };
            const key = JSON.stringify([state.stadium, state.config, $("roof").checked, $("open").checked]);
            if (turn !== undefined && turnKey !== key) { turn.destroy(); turn = undefined; }
            if (turn === undefined) {
              stage.innerHTML = '<div id="three"></div>';
              turnKey = key;
              turn = mountKyogijoTurn($("three"), options, settings);
            } else {
              turn.update(options);
              turn.preset($("viewpoint").value);
            }
          } else {
            if (turn !== undefined) { turn.destroy(); turn = undefined; }
            stage.innerHTML = drawKyogijo(options);
          }
        } catch (error) {
          $("error").textContent = String(error.message);
          $("error").hidden = false;
        }
        listFacts();
        syncUrl();
        const back = new URLSearchParams({ sport: state.config });
        if ($("language").value === "ja") back.set("lang", "ja");
        $("back").href = `./?${back}`;
        const lang = $("language").value === "ja" ? "&lang=ja" : "";
        $("district").href = `./district.html?venues=${state.stadium === "bc-place" ? `${state.stadium}:${state.config},rogers-arena` : `t-mobile-park,lumen-field`}${lang}`;
        document.body.dataset.ready = "true";
      }

      labelPage();
      $("stadium-tabs").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-stadium]");
        if (button === null) return;
        state.stadium = button.dataset.stadium;
        if (!stadiumConfigs(STADIUMS[state.stadium]).includes(state.config)) state.config = stadiumConfigs(STADIUMS[state.stadium])[0];
        labelPage();
        draw();
      });
      $("tabs").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-config]");
        if (button === null) return;
        state.config = button.dataset.config;
        for (const other of $("tabs").children) other.setAttribute("aria-selected", String(other === button));
        draw();
      });
      for (const id of ["view", "viewpoint", "roof", "open", "theme"]) $(id).addEventListener("input", draw);
      $("language").addEventListener("input", () => { labelPage(); draw(); });
      draw();
    </script>
  </body>
</html>
